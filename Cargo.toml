[package]
name = "rvbench-manager"
version = "0.1.0"
edition = "2024"

[lib]
name = "rvbench_manager"
path = "src/lib.rs"

[[bin]]
name = "rvbench-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rvbench-protocol = { git = "https://github.com/rvbench/rvbench-core-rust.git", rev = "52356fe8220762425b5b53926d84b5f118a5a304" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
