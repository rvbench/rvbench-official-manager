[package]
name = "rvbench-manager"
version = "0.1.0"
edition = "2024"

[lib]
name = "rvbench_manager"
path = "src/lib.rs"

[[bin]]
name = "rvbench-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rvbench-protocol = { git = "https://github.com/rvbench/rvbench-core-rust.git", rev = "6dbacf8d9d24140c6436e08fd8c495ef0b9793bc" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
