    "/auth/login": {
      "get": {
        "operationId": "beginLogin",
        "summary": "开始浏览器登录，302 到 provider",
        "security": [],
        "parameters": [
          {
            "name": "redirect",
            "in": "query",
            "description": "登录后回跳的**同源相对路径**，如 /ui",
            "schema": {
              "type": "string",
              "pattern": "^/[^/]",
              "maxLength": 512
            }
          }
        ],
        "responses": {
          "302": {
            "description": "重定向到 provider 授权页",
            "headers": {
              "Location": {
                "schema": {
                  "type": "string"
                }
              },
              "Set-Cookie": {
                "schema": {
                  "type": "string"
                },
                "description": "写入一次性 state cookie（HttpOnly，10 分钟）"
              }
            }
          },
          "400": {
            "description": "参数不合法",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/AuthError"
                }
              }
            }
          },
          "503": {
            "description": "auth.mode=off，登录未启用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/AuthError"
                }
              }
            }
          }
        }
      }
    },
    "/auth/callback": {
      "get": {
        "operationId": "finishLogin",
        "summary": "provider 回调；成功设 session cookie 并回跳",
        "security": [],
        "parameters": [
          {
            "name": "code",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "state",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "成功：Set-Cookie rvb_session，Location 为 login 时的 redirect 或 /ui。\n失败：Location 为 /ui?auth_error=<code>。\n",
            "headers": {
              "Location": {
                "schema": {
                  "type": "string"
                }
              },
              "Set-Cookie": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "description": "state 缺失/过期/已消费",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/AuthError"
                }
              }
            }
          },
          "502": {
            "description": "provider 不可达",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/AuthError"
                }
              }
            }
          }
        }
      }
    },
    "/auth/github/exchange": {
      "post": {
        "operationId": "exchangeGithubToken",
        "summary": "CLI 用 GitHub access token 换 rvbench token",
        "description": "CLI 走 GitHub device flow 拿到 access token 后调用。manager 校验 token、\n解析角色、签发 rvb_ token。GitHub token 不会被保存。\n静态 provider（测试）下 access_token 直接是 login。\n",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/TokenExchangeRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/TokenExchangeResponse"
                }
              }
            }
          },
          "401": {
            "description": "GitHub 拒绝该 token",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/AuthError"
                }
              }
            }
          },
          "429": {
            "description": "频率超限",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/AuthError"
                }
              }
            }
          },
          "502": {
            "description": "provider 不可达",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/AuthError"
