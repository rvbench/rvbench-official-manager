    "/auth/login": {
      "get": {
        "operationId": "beginLogin",
        "summary": "开始浏览器登录，302 到 provider",
        "security": [],
        "parameters": [
          {
            "name": "redirect",
            "in": "query",
            "description": "登录后回跳的**同源相对路径**，如 /ui",
            "schema": {
              "type": "string",
              "pattern": "^/[^/]",
              "maxLength": 512
            }
          }
        ],
        "responses": {
          "302": {
            "description": "重定向到 provider 授权页",
            "headers": {
              "Location": {
                "schema": {
                  "type": "string"
                }
              },
              "Set-Cookie": {
                "schema": {
                  "type": "string"
                },
                "description": "写入一次性 state cookie（HttpOnly，10 分钟）"
              }
            }
          },
          "400": {
            "description": "参数不合法",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/AuthError"
                }
              }
            }
          },
          "503": {
            "description": "auth.mode=off，登录未启用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/AuthError"
                }
              }
            }
          }
        }
      }
    },
    "/auth/callback": {
      "get": {
        "operationId": "finishLogin",
        "summary": "provider 回调；成功设 session cookie 并回跳",
        "security": [],
