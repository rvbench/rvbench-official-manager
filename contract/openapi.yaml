                  "type": "string",
                  "enum": [
                    "Bearer"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/AuthError"
                }
              }
            }
          }
        }
      }
    },
    "/console/instance": {
      "get": {
        "operationId": "consoleInstance",
        "summary": "控制面自述（admin）",
        "description": "设施管理页「控制面行」的数据源：版本、启动时间、listen、data_dir、ledger 大小、锁状态与 VictoriaMetrics 连通探测。\n",
        "tags": [
          "console"
        ],
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConsoleInstance"
                }
              }
            }
          },
          "401": {
            "description": "未登录或会话失效",
            "headers": {
              "WWW-Authenticate": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "Bearer"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/AuthError"
                }
              }
            }
          },
          "403": {
            "description": "已登录但缺权限（非 admin）",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/AuthError"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "rvb_",
        "description": "rvbench session token，形如 rvb_<32B base64url>"
      },
      "cookieAuth": {
        "type": "apiKey",
        "in": "cookie",
        "name": "rvb_session",
        "description": "浏览器会话；HttpOnly、Secure、SameSite=Lax"
      }
    },
    "schemas": {
      "MeResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "principal",
          "permissions",
          "roles_stale",
          "session",
          "is_first_login"
        ],
        "properties": {
          "principal": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "sub",
              "login",
              "roles",
              "created_at"
            ],
            "properties": {
              "sub": {
                "type": "string",
                "pattern": "^(github:[0-9]+|worker:[A-Za-z0-9_-]{1,64})$",
                "description": "稳定的 provider 主体标识；login 改名不影响。"
              },
              "login": {
                "type": "string"
              },
              "name": {
                "type": [
                  "string",
                  "null"
                ]
              },
              "email": {
                "type": [
                  "string",
                  "null"
                ],
                "format": "email",
                "description": "本人可见自己的邮箱；GitHub 私有信息或 static provider 下为 null。"
              },
              "avatar_url": {
                "type": [
                  "string",
                  "null"
                ],
                "format": "uri",
                "description": "头像外链（GitHub 形如 https://avatars.githubusercontent.com/u/123?v=4）。允许为 null：static provider、GitHub 私有信息或限流时不返回；null ⇒ 前端用 name 或 login 的首字母兜底，后端不生成占位图。前端消费时在 URL 上追加 &s=96 取 96px（28/44/56 三处复用），后端不改写 URL、不把第三方参数固化进库。服务端不代理、不转存、不缓存头像二进制，由浏览器直连 avatars.githubusercontent.com（将来加 CSP 时把该域放进 img-src）。"
              },
              "provider": {
                "type": "string",
                "enum": [
                  "github",
                  "oidc",
                  "static",
                  "worker"
                ]
              },
              "roles": {
                "type": "array",
                "uniqueItems": true,
                "items": {
                  "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/Role"
                }
              },
              "created_at": {
                "type": "string",
                "format": "date-time",
                "description": "first_seen，即该主体首次登录时间（个人中心「加入时间」）。"
              }
            }
          },
          "permissions": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string"
            }
          },
          "roles_stale": {
            "type": "boolean",
            "description": "provider 校验失败，roles 为降级结果（通常只剩 user）"
          },
          "session": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "kind",
              "expires_at"
            ],
            "properties": {
              "kind": {
                "type": "string",
                "enum": [
                  "web",
                  "cli",
                  "token"
                ],
                "description": "token = /auth/tokens 新建的个人访问凭证（rvb_ Bearer）。"
              },
              "expires_at": {
                "type": "string",
                "format": "date-time"
              }
            }
          },
          "is_first_login": {
            "type": "boolean",
            "description": "首次登录（first_seen == last_seen）；前端据此落地 #/welcome，此后为 false。"
          }
        }
      },
      "SessionItem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "kind",
          "created_at",
          "expires_at",
          "last_seen",
          "revoked",
          "current"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{16}$"
          },
          "kind": {
            "type": "string",
            "enum": [
              "web",
              "cli"
            ]
          },
          "label": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 64,
            "description": "会话备注名；未命名为 null。"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "last_seen": {
            "type": "string",
            "format": "date-time"
          },
          "revoked": {
            "type": "boolean"
          },
          "current": {
            "type": "boolean",
            "description": "是否当前请求所用会话（token_sha256 == 当前会话）。"
          },
          "user_agent": {
            "type": [
              "string",
              "null"
            ]
          },
          "ip": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "TokenItem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "kind",
          "created_at",
          "expires_at",
          "last_used",
          "revoked"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{16}$",
            "description": "token_sha256 前 16 位；吊销用，不是明文 token。"
          },
          "kind": {
            "type": "string",
            "enum": [
              "cli",
              "token"
            ],
            "description": "cli = GitHub device flow 换得；token = 网页 /auth/tokens 新建。"
          },
          "label": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 64,
            "description": "凭证备注名；未命名为 null。"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "last_used": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time",
            "description": "从未使用过为 null。"
          },
          "revoked": {
            "type": "boolean"
          }
        }
      },
      "PrincipalItem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sub",
          "login",
          "roles",
          "first_seen",
          "last_seen",
          "deleted"
        ],
        "properties": {
          "sub": {
            "type": "string",
            "pattern": "^(github:[0-9]+|worker:[A-Za-z0-9_-]{1,64})$",
            "description": "稳定的 provider 主体标识；注销后仍保留（审计与任务归属要用）。"
          },
          "login": {
            "type": "string",
            "description": "注销后改写为 deleted-<sha8> 前缀。"
          },
          "name": {
            "type": [
              "string",
              "null"
            ]
          },
          "email": {
            "type": [
              "string",
              "null"
            ],
            "format": "email"
          },
          "avatar_url": {
            "type": [
              "string",
              "null"
            ],
            "format": "uri",
            "description": "头像外链；允许为 null（static provider、私有信息、限流），null ⇒ 前端用 name 或 login 首字母兜底。前端在 URL 追加 &s=96 取 96px；服务端不代理、不转存、不缓存二进制，浏览器直连 avatars.githubusercontent.com。注销账号固定为 null。"
          },
          "roles": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/Role"
            }
          },
          "first_seen": {
            "type": "string",
            "format": "date-time"
          },
          "last_seen": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time",
            "description": "从未登录完成过为 null。"
          },
          "deleted": {
            "type": "boolean",
            "description": "tombstone 标记；true 时 name/email/avatar_url 为空，展示层渲染「已注销用户」。"
          }
        }
      },
