{
  "openapi": "3.1.0",
  "info": {
    "title": "rvbench-manager",
    "version": "1.5.0",
    "description": "Auth (/auth/*) and worker management (/workers, /claims, worker claim) added in v1.2-1.3: GitHub OAuth2 login, role-derived permissions, per-worker rvbw_ credentials with ownership-based scheduling. v1.4 adds the account center: profile fields on /auth/me (email/avatar/created_at/is_first_login), personal access tokens (/auth/tokens), account deletion as tombstone (DELETE /auth/me), and the admin user/role console (/auth/users). v1.5 adds the console aggregate surface: GET /console/bootstrap (ETag/304, ~2s partial server cache), /console/facilities (k3/k1 aggregate), /console/capabilities (runtime x backend matrix with worker_auth token|open), /console/features (12-row catalog), admin-only /console/instance, the read-only viewer role, and the dual-written /workers owner shape (owner.login deprecated in favor of owner.display/owner.deleted). See docs/specs/2026-10-24-用户身份与权限-设计与架构.md, docs/plans/2026-10-24-worker认证与权限-前后端实现计划.md, docs/plans/2026-10-27-登录与个人中心-后端执行计划.md and docs/plans/2026-10-27-console-整体升级-后端配套计划.md."
  },
  "security": [],
  "tags": [
    {
      "name": "console",
      "description": "console 整体升级（v1.5）新增的控制台聚合端点；与 /observability/* 并存且不改其语义，任意已登录可用（/console/instance 需 admin）"
    }
  ],
