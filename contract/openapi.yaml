          },
          "started_at": {
            "type": "string",
            "format": "date-time"
          },
          "listen": {
            "type": "string",
            "description": "监听地址（host:port）。"
          },
          "data_dir": {
            "type": "string"
          },
          "ledger_bytes": {
            "type": "integer",
            "description": "ledger 文件大小（字节）。"
          },
          "locked": {
            "type": "boolean",
            "description": "ledger 全局写锁是否被持有。"
          },
          "victoriametrics": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "configured",
              "reachable",
              "latency_ms"
            ],
            "properties": {
              "configured": {
                "type": "boolean",
                "description": "config.victoriametrics 是否配置。"
              },
              "reachable": {
                "type": "boolean",
                "description": "最近一次连通探测结果；未配置时为 false。"
              },
              "latency_ms": {
                "type": [
                  "integer",
                  "null"
                ],
                "description": "探测往返毫秒；未配置或不可达为 null。"
              }
            }
          }
        }
      },
      "WorkerOwner": {
        "type": "object",
        "additionalProperties": false,
        "description": "v1.5 起 /workers 家族响应的 owner 双写形状：login（旧）与 display/deleted（新）并存一个版本，前端切换到 display 后移除 login。",
        "required": [
          "sub",
          "login",
          "display",
          "deleted"
        ],
        "properties": {
          "sub": {
            "type": "string",
            "pattern": "^(github:[0-9]+|org:[a-z0-9_-]{1,32})$",
            "description": "稳定的主体标识；owner 注销后仍保留（任务归属与审计要用）。"
          },
          "login": {
            "type": "string",
            "deprecated": true,
            "description": "兼容期双写。记录创建时的快照值：owner 注销后不再更新（可能仍是旧 login），不适合展示；前端改用 display 判断渲染，切换完成后本字段移除。"
          },
          "display": {
            "type": "string",
            "description": "展示名：正常为 name（缺省为 login）；owner 已注销时固定「已注销用户」。"
          },
          "deleted": {
            "type": "boolean",
            "description": "owner 账号是否已注销（tombstone）。"
          }
        }
      },
      "WorkerRecord": {
        "type": "object",
        "additionalProperties": false,
        "description": "manager 侧 v1.5 本地形状：与主仓 WorkerRecord 相同，唯 owner 采用 v1.5 双写形状（display/deleted）。",
        "required": [
          "worker_id",
          "owner",
          "visibility",
          "status",
          "token_prefix",
          "created_at"
        ],
        "properties": {
          "worker_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,64}$"
          },
          "owner": {
            "$ref": "#/components/schemas/WorkerOwner"
          },
          "visibility": {
            "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/WorkerVisibility"
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "active",
              "revoked"
            ],
            "description": "pending=已创建未注册；active=有心跳；revoked=token 已撤销"
          },
          "token_prefix": {
            "type": "string",
            "pattern": "^rvbw_[A-Za-z0-9_-]{4}$"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "last_seen": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "online": {
            "type": "boolean",
            "description": "由 last_seen 推导，非持久字段"
          }
        }
      },
      "WorkerCreated": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "worker",
          "token"
        ],
        "properties": {
          "worker": {
            "$ref": "#/components/schemas/WorkerRecord"
          },
          "token": {
            "$ref": "https://raw.githubusercontent.com/rvbench/rvbench/main/contracts/openapi.json#/components/schemas/WorkerToken"
          }
        }
      }
    }
  }
}